name: setup

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphs/**'
      - 'Workloads/**'
      - 'sample_configs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphs/**'
      - 'Workloads/**'
      - 'sample_configs/**'

permissions:
  contents: read

# rocm-build pulls ~13 GB of ROCm SDK wheels, so never let rapid pushes queue
# duplicate runs of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# setup_env.py is the single cross-platform entry point. Two jobs cover it with
# no GPU on either OS:
#   setup:      setup_env.py's own error contracts, a full --torch-mode cuda
#               install (CUDA torch's early-exit path completes without
#               hardware), and the unit suite.
#   rocm-build: a real --torch-mode rocm from-source build (hipDNN + all provider
#               plugins + Python bindings) against the ROCm torch nightly's
#               bundled SDK wheels. Compiling and linking need no device, only
#               --gpu-arch to pick the nightly bucket and set
#               GPU_TARGETS/AMDGPU_TARGETS. Linux is additionally verified on
#               real gfx90a hardware; Windows is gated here but has never been
#               confirmed on a Windows/ROCm host.
defaults:
  run:
    # GitHub's windows-2022 runners ship Git-bash, so a single bash step keeps
    # the assertions identical across OSes.
    shell: bash

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # No submodules: the rocm-libraries submodule stays empty; the tested
      # paths (validation + CUDA early-exit) never need it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # Assert setup_env.py's own error paths. The parser contract (bad choice,
      # unknown flag) is argparse's and is already covered by
      # tests/unit/cli/test_setup_script.py. -y is required: these modes leave
      # do_build on, so confirm_build() would otherwise block on stdin.
      - name: Validation smoke (no network)
        run: |
          rc=0
          python setup_env.py --torch-mode existing -y \
            --workspace .no-such-ws 2> existing.err || rc=$?
          cat existing.err
          test "$rc" -eq 1
          grep -q "requires an existing virtual environment" existing.err

      # Linux-only: Windows torch wheels are published per-arch under v2/, so any
      # arch resolves to a URL and a bad one surfaces from pip, not from us.
      - name: Validation smoke (unsupported arch)
        if: runner.os == 'Linux'
        run: |
          rc=0
          python setup_env.py --gpu-arch bogus -y \
            --workspace .bad-arch-ws 2> arch.err || rc=$?
          cat arch.err
          test "$rc" -eq 1
          grep -q "Unsupported GPU architecture 'bogus'" arch.err

      # cu124 torch yields a CUDA-enabled wheel on both linux-64 and win-64 (bare
      # PyPI torch is CPU-only on Windows, which would report mode 'cpu' and fail
      # require_torch_mode cuda). cu124 torch reports torch.version.cuda set even
      # with no GPU, so get_torch_mode -> cuda and the early-exit path completes
      # without hardware.
      - name: Install smoke (no-GPU CUDA path)
        run: |
          python setup_env.py \
            --torch-mode cuda \
            --torch-index-url https://download.pytorch.org/whl/cu124 \
            --workspace .ci-workspace

      - name: Assert install and run unit tests
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV=.ci-workspace/.venv/Scripts
          else
            VENV=.ci-workspace/.venv/bin
          fi
          "$VENV/python" -c "import dnn_benchmarking; print('dnn_benchmarking OK')"
          "$VENV/dnn-benchmark" --help
          "$VENV/python" -m pytest -m "not gpu" -q

  rocm-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # gfx90a is a datacenter arch served by the Linux nightly buckets;
          # gfx1151 is the only arch with published Windows torch wheels.
          - os: ubuntu-24.04
            gpu-arch: gfx90a
          - os: windows-2022
            gpu-arch: gfx1151
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      # rocm-sdk-devel unpacks to ~13 GB; standard ubuntu-24.04 runners start
      # with only ~16 GB free, which isn't enough headroom alongside the sparse
      # rocm-libraries checkout. Reclaim preinstalled toolchains this job doesn't
      # use and skip pip's cache to keep the build's footprint self-contained.
      # $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache) is deliberately left alone:
      # setup-python below reads it, and wiping it forces a redownload.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup || true
          docker system prune -af || true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Full rocm-mode build (no GPU)
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          python setup_env.py \
            --gpu-arch ${{ matrix.gpu-arch }} \
            --workspace .ci-rocm-workspace \
            -y

      # The build installs the whole tool on top of the compiled bindings. Assert
      # the full no-GPU surface: the hipdnn_frontend extension loads and its ROCm
      # deps resolve, and the tool imports and its CLI runs. A real benchmark
      # needs a GPU (hipDNN Handle + kernel dispatch), so that stays on the
      # on-hardware gfx90a run.
      - name: Assert install
        run: |
          # Windows rocm mode installs into the wheel env wheel_build_setup.ps1
          # owns; see setup_env.py's _select_windows_wheel_venv.
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV=.ci-rocm-workspace/rocm-wheel-venv/Scripts
          else
            VENV=.ci-rocm-workspace/.venv/bin
          fi
          "$VENV/python" -c "import hipdnn_frontend; print('hipdnn_frontend OK')"
          "$VENV/python" -c "import dnn_benchmarking; print('dnn_benchmarking OK')"
          "$VENV/dnn-benchmark" --help
