name: setup

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphs/**'
      - 'Workloads/**'
      - 'sample_configs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphs/**'
      - 'Workloads/**'
      - 'sample_configs/**'

permissions:
  contents: read

# gpu-test pulls ~13 GB of ROCm SDK wheels, so never let rapid pushes queue
# duplicate runs of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# setup validates the cross-platform CUDA install path without a GPU.
# gpu-test builds hipDNN + providers from source for gfx942 on a real GPU
# machine and runs the full suite there -- one build, then every test in the
# repo, including the gpu-marked tests setup deselects.
defaults:
  run:
    # Windows runners ship Git Bash, so a single bash step keeps
    # the assertions identical across OSes.
    shell: bash

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: aws-linux-scale-rocm-small
            platform: linux
          - os: aws-windows-scale-rocm-prod
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # No submodules: the rocm-libraries submodule stays empty; the tested
      # paths (validation + CUDA early-exit) never need it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Linux-only: with no rocm_agent_enumerator/rocminfo on the runner and no
      # --gpu-arch override, detection returns "" and install_torch fails fast
      # before touching the network. Windows always has a default arch, so
      # this path never fires there -- an arch the index doesn't recognize is
      # a pip resolver problem, not one setup_env.py can catch itself.
      - name: Validation smoke (missing GPU arch)
        if: runner.os == 'Linux'
        run: |
          rc=0
          python setup_env.py -y \
            --workspace .bad-arch-ws 2> arch.err || rc=$?
          cat arch.err
          test "$rc" -eq 1
          grep -q "could not detect a GPU architecture" arch.err

      # cu124 torch yields a CUDA-enabled wheel on both linux-64 and win-64 (bare
      # PyPI torch is CPU-only on Windows, which would report mode 'cpu' and fail
      # require_torch_mode cuda). cu124 torch reports torch.version.cuda set even
      # with no GPU, so get_torch_mode -> cuda and the early-exit path completes
      # without hardware.
      - name: Install smoke (no-GPU CUDA path)
        run: |
          python setup_env.py \
            --torch-mode cuda \
            --torch-index-url https://download.pytorch.org/whl/cu124 \
            --workspace .ci-workspace

      - name: Assert install and run unit tests
        env:
          DNN_BENCH_WORKSPACE: ${{ github.workspace }}/.ci-workspace
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV=.ci-workspace/.venv/Scripts
          else
            VENV=.ci-workspace/.venv/bin
          fi
          "$VENV/python" -m pip install -e ".[test]"
          "$VENV/python" -c "import dnn_benchmarking; print('dnn_benchmarking OK')"
          "$VENV/dnn-benchmark" --help
          "$VENV/python" -m pytest -m "not gpu" -q

  gpu-test:
    runs-on: linux-gfx942-1gpu-ccs-csp-ossci-rocm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Full rocm-mode build (real GPU)
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          python setup_env.py \
            --gpu-arch gfx942 \
            --workspace .ci-gpu-workspace \
            -y

      # Activating the venv (rather than invoking $VENV/python directly, as
      # the setup job does) picks up the ROCM_PATH/LD_LIBRARY_PATH that
      # setup_env.py writes to activate.local -- the plugin-discovery
      # fixtures in tests/conftest.py need those to find the built engine
      # plugins. No -m filter: this is the only job with real hardware, so it
      # runs every test in the repo, including gpu-marked ones setup
      # deselects. Tests needing rocprofv3/perf/rocprof-compute binaries
      # self-skip via shutil.which when a tool isn't installed on the runner.
      - name: Install test extras and run full suite on hardware
        env:
          DNN_BENCH_WORKSPACE: ${{ github.workspace }}/.ci-gpu-workspace
        run: |
          source .ci-gpu-workspace/.venv/bin/activate
          pip install -e ".[test]"
          python -c "import hipdnn_frontend; print('hipdnn_frontend OK')"
          python -c "import dnn_benchmarking; print('dnn_benchmarking OK')"
          dnn-benchmark --help
          pytest -q