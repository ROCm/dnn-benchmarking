name: setup

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphs/**'
      - 'Workloads/**'
      - 'sample_configs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphs/**'
      - 'Workloads/**'
      - 'sample_configs/**'

permissions:
  contents: read

# gpu-test pulls ~13 GB of ROCm SDK wheels; don't queue duplicate runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# setup: no-GPU install paths, cross-platform. gpu-test: real hardware, full suite.
defaults:
  run:
    # Windows runners ship Git Bash, so one bash step works on both OSes.
    shell: bash

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: aws-linux-scale-rocm-small
            platform: linux
          - os: aws-windows-scale-rocm-prod
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # No submodules: neither tested path needs rocm-libraries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Linux-only: asserts arch detection fails fast on a GPU-less runner.
      # Windows can't fail this way -- it falls back to a default arch.
      - name: Validation smoke (missing GPU arch)
        if: runner.os == 'Linux'
        run: |
          rc=0
          python setup_env.py -y \
            --workspace .bad-arch-ws 2> arch.err || rc=$?
          cat arch.err
          test "$rc" -eq 1
          grep -q "could not detect a GPU architecture" arch.err

      # cu124 (not bare PyPI torch, which is CPU-only on Windows) reports
      # torch.version.cuda even with no GPU, so the cuda path completes here.
      - name: Install smoke (no-GPU CUDA path)
        run: |
          python setup_env.py \
            --torch-mode cuda \
            --torch-index-url https://download.pytorch.org/whl/cu124 \
            --workspace .ci-workspace

      - name: Assert install and run unit tests
        env:
          DNN_BENCH_WORKSPACE: ${{ github.workspace }}/.ci-workspace
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV=.ci-workspace/.venv/Scripts
          else
            VENV=.ci-workspace/.venv/bin
          fi
          "$VENV/python" -m pip install -e ".[test]"
          "$VENV/python" -c "import dnn_benchmarking; print('dnn_benchmarking OK')"
          "$VENV/dnn-benchmark" --help
          "$VENV/python" -m pytest -m "not gpu" -q

  gpu-test:
    runs-on: linux-gfx942-1gpu-ccs-csp-ossci-rocm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # No --gpu-arch: detected from the runner's own GPU, so this job works
      # on any GPU runner label.
      - name: Full rocm-mode build
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          python setup_env.py \
            --workspace .ci-gpu-workspace \
            -y

      # activate (not $VENV/python) for the ROCM_PATH/LD_LIBRARY_PATH that
      # conftest.py's plugin discovery needs. No -m filter: gpu tests run here.
      - name: Install test extras and run full suite on hardware
        env:
          DNN_BENCH_WORKSPACE: ${{ github.workspace }}/.ci-gpu-workspace
        run: |
          source .ci-gpu-workspace/.venv/bin/activate
          pip install -e ".[test]"
          python -c "import hipdnn_frontend; print('hipdnn_frontend OK')"
          python -c "import dnn_benchmarking; print('dnn_benchmarking OK')"
          dnn-benchmark --help
          pytest -q