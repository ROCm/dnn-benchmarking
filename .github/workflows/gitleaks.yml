name: Gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        run: |
          curl --fail --location --retry 3 --output gitleaks.tar.gz "$GITLEAKS_URL"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum --check -
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan Git history
        run: ./gitleaks git --redact --log-opts="--all" .
