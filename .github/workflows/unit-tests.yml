name: unit-tests

# Fast unit-test signal on CPU-only torch; no GPU, no ROCm, no setup_env.py.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Workloads/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Workloads/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # torch is deliberately absent from pyproject.toml; install the CPU
      # wheel first so the editable install never pulls a CUDA build.
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"

      - name: Unit tests
        run: python -m pytest tests/unit -m 'not gpu' -q --durations=15
