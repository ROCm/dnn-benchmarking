name: Bandit

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/bandit.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check bandit==1.9.4
      - id: bandit
        name: Scan source and report findings
        run: |
          set +e
          bandit -r src -ll -f json -o bandit.json
          bandit_status=$?
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          findings = json.loads(Path("bandit.json").read_text())["results"]
          if not findings:
              print("Bandit: no Medium/High findings.")
          else:
              print("::group::Bandit Medium/High findings")
              print(f"Bandit: {len(findings)} Medium/High finding(s):")
              for finding in findings:
                  print(
                      "  - "
                      f"{finding['issue_severity']}: "
                      f"{finding['test_id']} "
                      f"{finding['filename']}:{finding['line_number']} — "
                      f"{finding['issue_text']}"
                  )
              print("::endgroup::")
          PY

          exit "$bandit_status"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit.json
          if-no-files-found: warn
          retention-days: 7
