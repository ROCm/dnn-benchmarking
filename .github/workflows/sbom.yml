name: SBOM

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'pyproject.toml'
      - '.github/workflows/sbom.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  generate:
    runs-on: aws-linux-scale-rocm-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          artifact-name: dnn-benchmarking-sbom
          upload-artifact-retention: 14
