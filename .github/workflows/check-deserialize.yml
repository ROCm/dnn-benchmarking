name: check-deserialize

on:
  pull_request:
    paths:
      - 'Workloads/**'
      - 'graphs/**'
      - 'src/dnn_benchmarking/graph/**'
      - 'tools/check_deserialize.py'
      - '.github/workflows/check-deserialize.yml'
  push:
    branches: [main]
    paths:
      - 'Workloads/**'
      - 'graphs/**'
      - 'src/dnn_benchmarking/graph/**'
      - 'tools/check_deserialize.py'
      - '.github/workflows/check-deserialize.yml'

permissions:
  contents: read

jobs:
  check-deserialize:
    runs-on: aws-linux-scale-rocm-small
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install DVC
        run: pip install "dvc[s3]"

      # .dvc/config sets allow_anonymous_login for the S3 remote, so this
      # needs no credentials. Total tracked workload size is ~1 MB.
      - name: Pull DVC-tracked workloads
        run: dvc pull

      # Different tarballs may contain graphs with the same relative path.
      - name: Extract workload tarballs
        run: |
          set -o pipefail
          first_archive="$(find Workloads -iname '*.tar.gz' -print -quit)"
          if [[ -z "$first_archive" ]]; then
            echo 'DVC pull materialized no workload tarballs' >&2
            exit 1
          fi
          find Workloads -iname '*.tar.gz' -print0 |
            while IFS= read -r -d '' archive; do
              dest="/tmp/workloads-extracted/${archive#Workloads/}"
              dest="${dest%.tar.gz}"
              mkdir -p "$dest"
              tar xzf "$archive" -C "$dest"
            done

      # --level json only exercises dnn_benchmarking's pure-Python
      # GraphLoader, which doesn't know hipDNN's real node contract (tensor
      # rank, dtype, connected-components, per-node field constraints). It's
      # a fast fail-fast gate for gross JSON/schema errors, not the safety
      # net -- that's the opgraph-level check below, which calls real
      # hipdnn_frontend and is the only level that has ever caught a graph
      # bug in this repo (see the moe.tar.gz fix history).
      - name: Fast pre-check (JSON schema only)
        run: |
          pip install -e .
          python tools/check_deserialize.py --level json --src src \
            /tmp/workloads-extracted graphs

      # No GPU required: from_json + validate + build_operation_graph only
      # assemble and finalize the backend operation-graph descriptor, no
      # plan build or kernel execution. --no-aiter: the AITER stage builds
      # AITER's JIT, which needs a ROCm install that this runner lacks, and
      # the opgraph check does not use AITER. ROCm PyTorch is the newest
      # nightly that Quartz reports as built and not failing tests for the
      # arch, or the ROCM_VERSION repository variable when it is set. The
      # arch is gfx942, not gfx90a: Quartz reports failed gfx90a ROCm tests
      # on most nightlies, and this build does not run on a GPU.
      - name: Build hipDNN (no GPU)
        env:
          PIP_NO_CACHE_DIR: "1"
          ROCM_VERSION: ${{ vars.ROCM_VERSION }}
        run: |
          python setup_env.py --gpu-arch gfx942 --workspace .ci-workspace -y --no-aiter \
            ${ROCM_VERSION:+--rocm-version "$ROCM_VERSION"}

      - name: Log the ROCm build
        run: |
          python -c 'import json, sys; r = json.load(open(sys.argv[1])); print("ROCm", r["rocm_version"], "built", r["build_date"], "from TheRock", r["therock_commit"], "(" + r["source"] + "), untested:", r["untested"])' \
            .ci-workspace/.venv/dnn-bench-rocm-build.json |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check opgraph-level graph deserialization
        run: |
          .ci-workspace/.venv/bin/python tools/check_deserialize.py \
            --level opgraph /tmp/workloads-extracted graphs
