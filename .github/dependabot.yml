# Dependabot version updates. See
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    cooldown:
      default-days: 0
    schedule:
      interval: "cron"
      cronjob: "0 12 * * 1,3"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore(rocm-libraries)"
    labels:
      - "dependencies"
  # GitHub Actions: keep workflow action versions current
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    # Wait a week before adopting newly released action versions.
    # ROCm security actions are excluded from the cooldown.
    cooldown:
      default-days: 7
      exclude:
        - "ROCm/rocm-security-gh*"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      rocm-security-gh:
        patterns:
          - "ROCm/rocm-security-gh*"
      github-actions:
        patterns:
          - "*"
